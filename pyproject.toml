[project]
name = "rag-qa"
version = "0.1.0"
description = "會自動判斷新鮮度、必要時上網搜尋補新資料的 RAG 問答 Agent（news/paper/github 三面向）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "chromadb>=0.5.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.30.0",
    "gradio>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
rag-qa = "rag_qa.cli:main"
rag-qa-ui = "rag_qa.ui:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
